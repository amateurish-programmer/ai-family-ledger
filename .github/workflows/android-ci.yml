name: Android APK

on:
  push:
    paths: ['android/**', '.github/workflows/android-ci.yml', 'scripts/publish-app-update.py', 'scripts/test_publish_app_update.py', 'scripts/build-update-fixtures.sh', 'docs/update-notes.txt']
  pull_request:
    paths: ['android/**', '.github/workflows/android-ci.yml', 'scripts/publish-app-update.py', 'scripts/test_publish_app_update.py', 'scripts/build-update-fixtures.sh', 'docs/update-notes.txt']
  workflow_dispatch:
    inputs:
      build_only:
        description: 'Only compile APK; skip test and lint execution'
        type: boolean
        default: false
      device_tests:
        description: 'Run emulator persistence and UI tests'
        type: boolean
        default: false
      auth_checks:
        description: 'Run focused cloud configuration, auth and chat tests'
        type: boolean
        default: false
      publish_release:
        description: 'Publish the verified APK to app updates after all tests succeed'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A later build must not cancel an already publishing release.
  group: android-${{ inputs.publish_release && github.run_id || github.ref }}
  cancel-in-progress: ${{ !inputs.publish_release }}

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-fixture-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-fixture-password
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check AI protocols with synthetic responses
        run: |
          node scripts/check-report-function.mjs
          node scripts/check-finance-chat.mjs
          node scripts/check-gift-ai.mjs
      - name: Check family profile permissions in isolated PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          for migration in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f "$migration"; done
          psql -v ON_ERROR_STOP=1 -f supabase/tests/family_profile.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/gift_metadata.sql
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.package.outputs.version }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Test update publication with synthetic storage
        run: python3 -m unittest discover -s ../scripts -p test_publish_app_update.py
      - name: Test, lint and build
        if: ${{ !inputs.build_only }}
        run: bash ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Build APK only
        if: ${{ inputs.build_only }}
        run: bash ./gradlew assembleDebug --stacktrace
      - name: Check cloud configuration and auth errors
        if: ${{ (inputs.auth_checks || inputs.publish_release) && inputs.build_only }}
        run: bash ./gradlew testDebugUnitTest --stacktrace
      - name: Name versioned installable package
        id: package
        shell: bash
        run: |
          python3 ../scripts/name-apk.py app/build/outputs/apk/debug/app-debug.apk ../dist/apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AI家庭账本-v${{ steps.package.outputs.version }}
          path: dist/apk/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-checks-${{ github.run_number }}
          path: |
            android/app/build/reports/
            android/app/schemas/
          retention-days: 14
  device-tests:
    if: github.event_name == 'workflow_dispatch' && (inputs.device_tests || inputs.publish_release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Build synthetic update APK fixtures
        run: bash scripts/build-update-fixtures.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: bash android/run-device-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-device-tests-${{ github.run_number }}
          path: android/app/build/reports/androidTests/
  publish:
    needs: [build, backend-tests, device-tests]
    if: >-
      ${{ always() && github.event_name == 'workflow_dispatch' && inputs.publish_release
          && github.repository == 'amateurish-programmer/ai-family-ledger'
          && github.ref == 'refs/heads/main'
          && needs.build.result == 'success' && needs.backend-tests.result == 'success'
          && needs.device-tests.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: publish-app-updates
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AI家庭账本-v${{ needs.build.outputs.version }}
          path: dist/apk
      - name: Publish APK and verified latest manifest
        env:
          SUPABASE_URL: https://xdgeybztysuvvwagqkvb.supabase.co
          SUPABASE_UPDATE_SERVICE_KEY: ${{ secrets.SUPABASE_UPDATE_SERVICE_KEY }}
        run: python3 scripts/publish-app-update.py
