name: Android APK

on:
  push:
    paths: ['android/**', '.github/workflows/android-ci.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android-ci.yml']
  workflow_dispatch:
    inputs:
      build_only:
        description: 'Only compile APK; skip test and lint execution'
        type: boolean
        default: false
      device_tests:
        description: 'Run emulator persistence and UI tests'
        type: boolean
        default: false
      auth_checks:
        description: 'Run focused cloud configuration, auth and chat tests'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-fixture-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-fixture-password
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check AI protocols with synthetic responses
        run: |
          node scripts/check-report-function.mjs
          node scripts/check-finance-chat.mjs
      - name: Check family profile permissions in isolated PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          for migration in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f "$migration"; done
          psql -v ON_ERROR_STOP=1 -f supabase/tests/family_profile.sql
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build
        if: ${{ !inputs.build_only }}
        run: bash ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Build APK only
        if: ${{ inputs.build_only }}
        run: bash ./gradlew assembleDebug --stacktrace
      - name: Check cloud configuration and auth errors
        if: ${{ inputs.auth_checks && inputs.build_only }}
        run: bash ./gradlew testDebugUnitTest --stacktrace
      - name: Name versioned installable package
        id: package
        shell: bash
        run: |
          python3 ../scripts/name-apk.py app/build/outputs/apk/debug/app-debug.apk ../dist/apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AI家庭账本-v${{ steps.package.outputs.version }}
          path: dist/apk/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-checks-${{ github.run_number }}
          path: |
            android/app/build/reports/
            android/app/schemas/
          retention-days: 14
  device-tests:
    if: github.event_name == 'workflow_dispatch' && inputs.device_tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: bash android/run-device-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-device-tests-${{ github.run_number }}
          path: android/app/build/reports/androidTests/
